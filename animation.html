<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkers</title>
<style>
  :root {
    /* Same system as the bench: cool flat ground for the instrumentation,
       warm raised panel for the thing a user would actually see. */
    --bg: #DADFE0;
    --fg: #0F1214;
    --fg-dim: #3F4749;
    --fg-faint: #636C6F;
    --line: rgba(15, 18, 20, 0.22);
    --line-soft: rgba(15, 18, 20, 0.1);
    --signal: #A32414;
    --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --big: clamp(2.5rem, 5vw, 4rem);
    --pad: clamp(20px, 3vw, 44px);
    --gutter: clamp(20px, 3vw, 44px);
    --cycle: 0.9s;
    --figw: 186px;
    /* One stride per gait cycle, and the road pattern repeats over exactly
       that distance, so the loop is seamless and the feet do not skate. */
    --stride: 84px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
  }

  ::selection { background: var(--fg); color: var(--bg); }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }

  @media (min-width: 901px) {
    body { height: 100vh; height: 100dvh; }
  }

  /* One bar, carrying the only two things left: what this is, and the
     button that takes the thread away. */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: calc(var(--pad) * 0.45) var(--pad);
    border-top: 1px solid var(--line);
  }

  .wordmark {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    margin: 0;
  }

  /* ------------------------------------------------------------------ */
  /* Stage. The animation is the product here, so it takes the panel     */
  /* treatment: warm ground, white cards, slightly raised.               */
  /* ------------------------------------------------------------------ */

  .stage {
    display: grid;
    grid-template-columns: 1fr 1.618fr;
    column-gap: var(--gutter);
    align-items: center;
    background: #F5F3EF;
    --bg: #F5F3EF;
    --fg: #0B0B0B;
    --fg-dim: #5E5E5A;
    --fg-faint: #757570;
    --line: rgba(11, 11, 11, 0.18);
    --line-soft: rgba(11, 11, 11, 0.07);
    color: var(--fg);
    padding: clamp(16px, 1.8vw, 22px) var(--pad);
  }

  .lede {
    margin: 0;
    max-width: 15ch;
    font-size: clamp(1.4rem, 2.4vw, 2.2rem);
    line-height: 1.1;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  .lede em { font-style: normal; color: var(--fg-dim); }

  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gutter); }

  .card {
    margin: 0;
    background: #FFFFFF;
    border: 1px solid rgba(11, 11, 11, 0.12);
    border-radius: 4px;
    box-shadow: 0 1px 1px rgba(11, 11, 11, 0.03), 0 10px 24px -12px rgba(11, 11, 11, 0.18);
    padding: 6px 0 14px;
  }

  .card figcaption {
    font-size: 12.5px;
    color: var(--fg-dim);
    text-align: center;
    padding: 0 12px;
  }

  .card figcaption b { display: block; color: var(--fg); font-weight: 500; }
  .card figcaption code { font-family: var(--mono); font-size: 11.5px; }

  /* ------------------------------------------------------------------ */
  /* The figures. Ten joints each: hip, knee and ankle on both legs,     */
  /* shoulder and elbow on both arms. One skeleton, one gait, three ways */
  /* of driving it -- two of which need this thread.                     */
  /* ------------------------------------------------------------------ */

  /* The ground belongs to the track, not to the walker: it has to stay put
     while the walker crosses it. */
  .track {
    position: relative;
    height: 306px;
    overflow: hidden;
  }

  /* The strip only ever shifts one stride, so it needs to be exactly that
     much wider than the track -- not the 3x it used to be, which made for a
     needlessly large layer to rasterise and translate on a wide screen. */
  .ground {
    position: absolute;
    top: 266px;
    left: 0;
    width: calc(100% + var(--stride));
    height: 4px;
    /* The period must divide the stride exactly or the loop seams -- so it
       is the stride, 84px, carrying one long mark and two short ones. All
       marks the same length reads as a barber pole: identical marks plus a
       shift that lands back on itself give the eye nothing to lock onto,
       and on a wide card the motion can look like no motion at all. */
    background: repeating-linear-gradient(to right,
      rgba(11, 11, 11, 0.55) 0 34px, transparent 34px 44px,
      rgba(11, 11, 11, 0.55) 44px 60px, transparent 60px 70px,
      rgba(11, 11, 11, 0.55) 70px 76px, transparent 76px 84px);
  }

  .fig { position: relative; width: var(--figw); height: 306px; margin: 0 auto; }

  .fig .body { position: absolute; inset: 0; will-change: transform; }
  .fig .head { position: absolute; left: 73px; top: 42px; width: 38px; height: 38px; border: 4px solid; border-radius: 50%; }
  .fig .torso { position: absolute; left: 90px; top: 81px; width: 5px; height: 83px; border-radius: 3px; }

  .fig .limb {
    position: absolute; left: 90px; width: 5px; border-radius: 3px;
    transform-origin: 50% 2.5px; will-change: transform;
  }

  .fig .arm { top: 91px; height: 31px; }
  .fig .leg { top: 164px; height: 47px; }

  .fig .seg {
    position: absolute; left: 0; width: 5px; border-radius: 3px;
    transform-origin: 50% 2.5px; will-change: transform;
  }

  .fig .forearm { top: 29px; height: 29px; }
  .fig .shin { top: 45px; height: 47px; }

  .fig .foot {
    position: absolute; left: 0; top: 45px; width: 20px; height: 5px;
    border-radius: 3px; transform-origin: 2.5px 50%; will-change: transform;
  }

  .fig .far { opacity: 0.45; }

  /* Red is main-thread: both of those stop when the thread stops. Only the
     compositor-driven one keeps its stride, and it is the odd one out. */
  .fig.js .head,
  .fig.css-left .head { border-color: var(--signal); }
  .fig.js .torso, .fig.js .limb, .fig.js .seg, .fig.js .foot,
  .fig.css-left .torso, .fig.css-left .limb, .fig.css-left .seg, .fig.css-left .foot { background: var(--signal); }
  .fig.css-gpu .head { border-color: var(--fg); }
  .fig.css-gpu .torso, .fig.css-gpu .limb, .fig.css-gpu .seg, .fig.css-gpu .foot { background: var(--fg); }

  @keyframes hipA { 0% { transform: rotate(0.0deg); } 6.25% { transform: rotate(9.95deg); } 12.5% { transform: rotate(18.38deg); } 18.75% { transform: rotate(24.02deg); } 25% { transform: rotate(26.0deg); } 31.25% { transform: rotate(24.02deg); } 37.5% { transform: rotate(18.38deg); } 43.75% { transform: rotate(9.95deg); } 50% { transform: rotate(0.0deg); } 56.25% { transform: rotate(-9.95deg); } 62.5% { transform: rotate(-18.38deg); } 68.75% { transform: rotate(-24.02deg); } 75% { transform: rotate(-26.0deg); } 81.25% { transform: rotate(-24.02deg); } 87.5% { transform: rotate(-18.38deg); } 93.75% { transform: rotate(-9.95deg); } 100% { transform: rotate(-0.0deg); } }
  @keyframes hipB { 0% { transform: rotate(0.0deg); } 6.25% { transform: rotate(-9.95deg); } 12.5% { transform: rotate(-18.38deg); } 18.75% { transform: rotate(-24.02deg); } 25% { transform: rotate(-26.0deg); } 31.25% { transform: rotate(-24.02deg); } 37.5% { transform: rotate(-18.38deg); } 43.75% { transform: rotate(-9.95deg); } 50% { transform: rotate(-0.0deg); } 56.25% { transform: rotate(9.95deg); } 62.5% { transform: rotate(18.38deg); } 68.75% { transform: rotate(24.02deg); } 75% { transform: rotate(26.0deg); } 81.25% { transform: rotate(24.02deg); } 87.5% { transform: rotate(18.38deg); } 93.75% { transform: rotate(9.95deg); } 100% { transform: rotate(0.0deg); } }
  @keyframes kneeA { 0% { transform: rotate(0.0deg); } 6.25% { transform: rotate(0.0deg); } 12.5% { transform: rotate(0.0deg); } 18.75% { transform: rotate(0.0deg); } 25% { transform: rotate(0.0deg); } 31.25% { transform: rotate(19.9deg); } 37.5% { transform: rotate(36.77deg); } 43.75% { transform: rotate(48.04deg); } 50% { transform: rotate(52.0deg); } 56.25% { transform: rotate(48.04deg); } 62.5% { transform: rotate(36.77deg); } 68.75% { transform: rotate(19.9deg); } 75% { transform: rotate(0.0deg); } 81.25% { transform: rotate(0.0deg); } 87.5% { transform: rotate(0.0deg); } 93.75% { transform: rotate(0.0deg); } 100% { transform: rotate(0.0deg); } }
  @keyframes kneeB { 0% { transform: rotate(52.0deg); } 6.25% { transform: rotate(48.04deg); } 12.5% { transform: rotate(36.77deg); } 18.75% { transform: rotate(19.9deg); } 25% { transform: rotate(0.0deg); } 31.25% { transform: rotate(0.0deg); } 37.5% { transform: rotate(0.0deg); } 43.75% { transform: rotate(0.0deg); } 50% { transform: rotate(0.0deg); } 56.25% { transform: rotate(0.0deg); } 62.5% { transform: rotate(0.0deg); } 68.75% { transform: rotate(0.0deg); } 75% { transform: rotate(0.0deg); } 81.25% { transform: rotate(19.9deg); } 87.5% { transform: rotate(36.77deg); } 93.75% { transform: rotate(48.04deg); } 100% { transform: rotate(52.0deg); } }
  @keyframes footA { 0% { transform: rotate(-0.0deg); } 6.25% { transform: rotate(-8.95deg); } 12.5% { transform: rotate(-16.55deg); } 18.75% { transform: rotate(-21.62deg); } 25% { transform: rotate(-23.4deg); } 31.25% { transform: rotate(-39.53deg); } 37.5% { transform: rotate(-49.64deg); } 43.75% { transform: rotate(-52.19deg); } 50% { transform: rotate(-46.8deg); } 56.25% { transform: rotate(-34.28deg); } 62.5% { transform: rotate(-16.55deg); } 68.75% { transform: rotate(3.71deg); } 75% { transform: rotate(23.4deg); } 81.25% { transform: rotate(21.62deg); } 87.5% { transform: rotate(16.55deg); } 93.75% { transform: rotate(8.95deg); } 100% { transform: rotate(0.0deg); } }
  @keyframes footB { 0% { transform: rotate(-46.8deg); } 6.25% { transform: rotate(-34.28deg); } 12.5% { transform: rotate(-16.55deg); } 18.75% { transform: rotate(3.71deg); } 25% { transform: rotate(23.4deg); } 31.25% { transform: rotate(21.62deg); } 37.5% { transform: rotate(16.55deg); } 43.75% { transform: rotate(8.95deg); } 50% { transform: rotate(0.0deg); } 56.25% { transform: rotate(-8.95deg); } 62.5% { transform: rotate(-16.55deg); } 68.75% { transform: rotate(-21.62deg); } 75% { transform: rotate(-23.4deg); } 81.25% { transform: rotate(-39.53deg); } 87.5% { transform: rotate(-49.64deg); } 93.75% { transform: rotate(-52.19deg); } 100% { transform: rotate(-46.8deg); } }
  @keyframes shoulderA { 0% { transform: rotate(-0.0deg); } 6.25% { transform: rotate(-8.42deg); } 12.5% { transform: rotate(-15.56deg); } 18.75% { transform: rotate(-20.33deg); } 25% { transform: rotate(-22.0deg); } 31.25% { transform: rotate(-20.33deg); } 37.5% { transform: rotate(-15.56deg); } 43.75% { transform: rotate(-8.42deg); } 50% { transform: rotate(-0.0deg); } 56.25% { transform: rotate(8.42deg); } 62.5% { transform: rotate(15.56deg); } 68.75% { transform: rotate(20.33deg); } 75% { transform: rotate(22.0deg); } 81.25% { transform: rotate(20.33deg); } 87.5% { transform: rotate(15.56deg); } 93.75% { transform: rotate(8.42deg); } 100% { transform: rotate(0.0deg); } }
  @keyframes shoulderB { 0% { transform: rotate(-0.0deg); } 6.25% { transform: rotate(8.42deg); } 12.5% { transform: rotate(15.56deg); } 18.75% { transform: rotate(20.33deg); } 25% { transform: rotate(22.0deg); } 31.25% { transform: rotate(20.33deg); } 37.5% { transform: rotate(15.56deg); } 43.75% { transform: rotate(8.42deg); } 50% { transform: rotate(0.0deg); } 56.25% { transform: rotate(-8.42deg); } 62.5% { transform: rotate(-15.56deg); } 68.75% { transform: rotate(-20.33deg); } 75% { transform: rotate(-22.0deg); } 81.25% { transform: rotate(-20.33deg); } 87.5% { transform: rotate(-15.56deg); } 93.75% { transform: rotate(-8.42deg); } 100% { transform: rotate(-0.0deg); } }
  @keyframes elbowA { 0% { transform: rotate(-12.0deg); } 6.25% { transform: rotate(-19.65deg); } 12.5% { transform: rotate(-26.14deg); } 18.75% { transform: rotate(-30.48deg); } 25% { transform: rotate(-32.0deg); } 31.25% { transform: rotate(-30.48deg); } 37.5% { transform: rotate(-26.14deg); } 43.75% { transform: rotate(-19.65deg); } 50% { transform: rotate(-12.0deg); } 56.25% { transform: rotate(-12.0deg); } 62.5% { transform: rotate(-12.0deg); } 68.75% { transform: rotate(-12.0deg); } 75% { transform: rotate(-12.0deg); } 81.25% { transform: rotate(-12.0deg); } 87.5% { transform: rotate(-12.0deg); } 93.75% { transform: rotate(-12.0deg); } 100% { transform: rotate(-12.0deg); } }
  @keyframes elbowB { 0% { transform: rotate(-12.0deg); } 6.25% { transform: rotate(-12.0deg); } 12.5% { transform: rotate(-12.0deg); } 18.75% { transform: rotate(-12.0deg); } 25% { transform: rotate(-12.0deg); } 31.25% { transform: rotate(-12.0deg); } 37.5% { transform: rotate(-12.0deg); } 43.75% { transform: rotate(-12.0deg); } 50% { transform: rotate(-12.0deg); } 56.25% { transform: rotate(-19.65deg); } 62.5% { transform: rotate(-26.14deg); } 68.75% { transform: rotate(-30.48deg); } 75% { transform: rotate(-32.0deg); } 81.25% { transform: rotate(-30.48deg); } 87.5% { transform: rotate(-26.14deg); } 93.75% { transform: rotate(-19.65deg); } 100% { transform: rotate(-12.0deg); } }
  @keyframes bob { 0% { transform: translateY(-4.0px); } 6.25% { transform: translateY(-3.41px); } 12.5% { transform: translateY(-2.0px); } 18.75% { transform: translateY(-0.59px); } 25% { transform: translateY(0.0px); } 31.25% { transform: translateY(-0.59px); } 37.5% { transform: translateY(-2.0px); } 43.75% { transform: translateY(-3.41px); } 50% { transform: translateY(-4.0px); } 56.25% { transform: translateY(-3.41px); } 62.5% { transform: translateY(-2.0px); } 68.75% { transform: translateY(-0.59px); } 75% { transform: translateY(0.0px); } 81.25% { transform: translateY(-0.59px); } 87.5% { transform: translateY(-2.0px); } 93.75% { transform: translateY(-3.41px); } 100% { transform: translateY(-4.0px); } }

  .fig.css-gpu [data-j],
  .fig.css-left [data-j] {
    animation-duration: var(--cycle);
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .fig.css-gpu [data-j="hipA"],
  .fig.css-left [data-j="hipA"] { animation-name: hipA; }
  .fig.css-gpu [data-j="hipB"],
  .fig.css-left [data-j="hipB"] { animation-name: hipB; }
  .fig.css-gpu [data-j="kneeA"],
  .fig.css-left [data-j="kneeA"] { animation-name: kneeA; }
  .fig.css-gpu [data-j="kneeB"],
  .fig.css-left [data-j="kneeB"] { animation-name: kneeB; }
  .fig.css-gpu [data-j="footA"],
  .fig.css-left [data-j="footA"] { animation-name: footA; }
  .fig.css-gpu [data-j="footB"],
  .fig.css-left [data-j="footB"] { animation-name: footB; }
  .fig.css-gpu [data-j="shoulderA"],
  .fig.css-left [data-j="shoulderA"] { animation-name: shoulderA; }
  .fig.css-gpu [data-j="shoulderB"],
  .fig.css-left [data-j="shoulderB"] { animation-name: shoulderB; }
  .fig.css-gpu [data-j="elbowA"],
  .fig.css-left [data-j="elbowA"] { animation-name: elbowA; }
  .fig.css-gpu [data-j="elbowB"],
  .fig.css-left [data-j="elbowB"] { animation-name: elbowB; }
  .fig.css-gpu [data-j="bob"],
  .fig.css-left [data-j="bob"] { animation-name: bob; }


  /* The same journey twice. left needs layout, so no engine will composite
     it; translateX is handed to the compositor by all of them. That one
     property is the entire difference between these two walkers. */
  @keyframes ground-left {
    from { left: 0px; }
    to { left: calc(0px - var(--stride)); }
  }

  @keyframes ground-x {
    from { transform: translateX(0); }
    to { transform: translateX(calc(0px - var(--stride))); }
  }

  .ground--left { animation: ground-left var(--cycle) linear infinite; }
  .ground--x { animation: ground-x var(--cycle) linear infinite; will-change: transform; }

  @media (prefers-reduced-motion: reduce) {
    .ground--left,
    .ground--x,
    .fig.css-gpu [data-j],
    .fig.css-left [data-j] { animation: none; }
  }

  button {
    font: inherit;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 9px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }

  button:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  @media (max-width: 1100px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 820px) {
    .trio { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<section class="stage">
  <p class="lede">Three walkers, <em>one gait</em>. Only one never needs this thread.</p>

  <div class="trio">
    <figure class="card">
      <div class="track"><span class="ground" id="jsGround"></span>
      <div class="fig js" id="jsFig">
        <div class="body" data-j="bob">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="limb arm far" data-j="shoulderB"><div class="seg forearm" data-j="elbowB"></div></div>
          <div class="limb leg far" data-j="hipB">
            <div class="seg shin" data-j="kneeB"><div class="foot" data-j="footB"></div></div>
          </div>
          <div class="limb arm" data-j="shoulderA"><div class="seg forearm" data-j="elbowA"></div></div>
          <div class="limb leg" data-j="hipA">
            <div class="seg shin" data-j="kneeA"><div class="foot" data-j="footA"></div></div>
          </div>
        </div>
      </div>
      </div>
      <figcaption><b>Driven by JavaScript</b>limbs and ground written every frame</figcaption>
    </figure>

    <figure class="card">
      <div class="track"><span class="ground ground--left"></span>
      <div class="fig css-left">
        <div class="body" data-j="bob">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="limb arm far" data-j="shoulderB"><div class="seg forearm" data-j="elbowB"></div></div>
          <div class="limb leg far" data-j="hipB">
            <div class="seg shin" data-j="kneeB"><div class="foot" data-j="footB"></div></div>
          </div>
          <div class="limb arm" data-j="shoulderA"><div class="seg forearm" data-j="elbowA"></div></div>
          <div class="limb leg" data-j="hipA">
            <div class="seg shin" data-j="kneeA"><div class="foot" data-j="footA"></div></div>
          </div>
        </div>
      </div>
      </div>
      <figcaption><b>Driven by CSS</b>limbs on <code>transform</code>, ground on <code>left</code></figcaption>
    </figure>

    <figure class="card">
      <div class="track"><span class="ground ground--x"></span>
      <div class="fig css-gpu">
        <div class="body" data-j="bob">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="limb arm far" data-j="shoulderB"><div class="seg forearm" data-j="elbowB"></div></div>
          <div class="limb leg far" data-j="hipB">
            <div class="seg shin" data-j="kneeB"><div class="foot" data-j="footB"></div></div>
          </div>
          <div class="limb arm" data-j="shoulderA"><div class="seg forearm" data-j="elbowA"></div></div>
          <div class="limb leg" data-j="hipA">
            <div class="seg shin" data-j="kneeA"><div class="foot" data-j="footA"></div></div>
          </div>
        </div>
      </div>
      </div>
      <figcaption><b>Driven by CSS</b>limbs and ground both on <code>transform</code></figcaption>
    </figure>
  </div>
</section>

<footer class="bar">
  <h1 class="wordmark">Walkers</h1>
  <button type="button" id="block">Block 1000 ms</button>
</footer>

<script>
(() => {
  'use strict';

  // -------------------------------------------------------------------
  // The gait. One set of functions here; the stylesheet holds the same
  // curves sampled every 6.25% of the cycle, so all three walkers strike
  // the same pose at the same phase and any difference on screen is down
  // to what is driving them.
  //
  // The figures face right, and a positive rotation swings a limb's far
  // end backward, so forward is negative. The knee may only flex on the
  // forward swing -- flex it on the drive instead and the walk reads as
  // backwards -- and the elbow may only flex forward, never behind.
  // -------------------------------------------------------------------
  const hip = (p) => 26 * Math.sin(p);
  const knee = (p) => 52 * Math.max(0, -Math.cos(p));
  const foot = (p) => -0.9 * (hip(p) + knee(p));
  const shoulder = (p) => -22 * Math.sin(p);
  const elbow = (p) => -(12 + 20 * Math.max(0, Math.sin(p)));
  // Two rises per gait cycle, one per step, peaking at mid-stance when the
  // body is up over a straight leg -- not at double support, when the legs
  // are splayed and it should be at its lowest.
  const bob = (p) => -2 - 2 * Math.cos(p * 2);

  const CYCLE_MS = 900;
  const PI = Math.PI;

  // Stride comes from the stylesheet, so the hand-driven walker covers
  // exactly the ground the other two do.
  const root = document.documentElement;
  const STRIDE = parseFloat(getComputedStyle(root).getPropertyValue('--stride')) || 84;

  const jsFig = document.getElementById('jsFig');
  const jsGround = document.getElementById('jsGround');

  const joints = {};
  for (const el of jsFig.querySelectorAll('[data-j]')) {
    joints[el.dataset.j] = el;
  }
  const rotate = (name, deg) => { joints[name].style.transform = 'rotate(' + deg + 'deg)'; };

  // The stylesheet's clock starts whenever the animation is first applied,
  // a few ms after navigation; this one would start at zero. Left alone the
  // hand-driven walker is permanently out of step -- at a 900 ms cycle even
  // 50 ms of drift is 20 degrees of hip -- for reasons that have nothing to
  // do with threads. So the stylesheet owns the clock and this reads it.
  const cssJoint = document.querySelector('.fig.css-gpu [data-j="hipA"]');
  let originMs = null;
  let originTries = 0;

  function phaseOrigin() {
    if (originMs !== null) return originMs;
    // startTime reads null until the animation actually starts, so this
    // retries -- but bounded, rather than allocating every frame forever on
    // a browser that never reports one. This loop is the thing under test.
    if (!cssJoint || !cssJoint.getAnimations || ++originTries > 120) {
      originMs = 0;
      return originMs;
    }
    const anim = cssJoint.getAnimations()[0];
    const start = anim && anim.startTime;
    const value = typeof start === 'number' ? start : (start && start.value);
    if (typeof value === 'number' && isFinite(value)) originMs = value;
    return originMs === null ? 0 : originMs;
  }

  function frame(now) {
    // Twelve writes, every frame, every one of them needing this thread.
    // None of them land while a long task is running.
    const elapsed = now - phaseOrigin();
    const p = (elapsed / CYCLE_MS) * PI * 2;
    rotate('hipA', hip(p));
    rotate('kneeA', knee(p));
    rotate('footA', foot(p));
    rotate('hipB', hip(p + PI));
    rotate('kneeB', knee(p + PI));
    rotate('footB', foot(p + PI));
    rotate('shoulderA', shoulder(p));
    rotate('elbowA', elbow(p));
    rotate('shoulderB', shoulder(p + PI));
    rotate('elbowB', elbow(p + PI));
    joints.bob.style.transform = 'translateY(' + bob(p) + 'px)';

    // The same ground the other two cover, worked out here instead.
    jsGround.style.transform =
      'translateX(' + -((elapsed % CYCLE_MS) / CYCLE_MS) * STRIDE + 'px)';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function block(ms) {
    const end = performance.now() + ms;
    let sink = 0;
    while (performance.now() < end) {
      for (let i = 0; i < 3000; i++) sink += Math.sqrt(i * 1.0001);
    }
    return sink;
  }

  document.getElementById('block').addEventListener('click', () => block(1000));
})();
</script>
</body>
</html>
